[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-latent-reasoner"
version = "0.1.0"
description = "Parallel Continuous Latent Deliberation with 3-Signal Dynamic E-Gate on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "QAN Research Team"}
]
keywords = [
    "latent-reasoning",
    "mlx",
    "apple-silicon",
    "gemma",
    "recurrent-transformer",
    "jacobi-deliberation",
    "dynamic-e-gate"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "mlx>=0.15.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
prlr-demo = "parallel_latent_reasoner.demo:main"
prlr-benchmark = "parallel_latent_reasoner.run_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
